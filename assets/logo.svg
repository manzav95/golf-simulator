<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Golf ball logo">
  <defs>
    <radialGradient id="ball" cx="30%" cy="28%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.55" stop-color="#f2f5f3" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#cfd8d3" stop-opacity="0.98"/>
    </radialGradient>
    <radialGradient id="shine" cx="26%" cy="22%" r="45%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <circle cx="32" cy="32" r="20" fill="url(#ball)" />
    <circle cx="26" cy="24" r="10" fill="url(#shine)" />

    <!-- dimples -->
    <g fill="rgba(0,0,0,0.08)">
      <circle cx="25" cy="34" r="1.5"/>
      <circle cx="31" cy="28" r="1.5"/>
      <circle cx="38" cy="30" r="1.5"/>
      <circle cx="40" cy="38" r="1.5"/>
      <circle cx="33" cy="40" r="1.5"/>
      <circle cx="28" cy="42" r="1.5"/>
      <circle cx="23" cy="40" r="1.5"/>
    </g>

    <circle cx="32" cy="32" r="20" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  </g>
</svg>
